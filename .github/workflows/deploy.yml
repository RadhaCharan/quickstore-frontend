name: Deploy Frontend → GCP Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write             # Required for Workload Identity Federation

env:
  PROJECT_ID: radhaproject-500302
  REGION: asia-south1
  SERVICE: quickstore-frontend
  IMAGE: asia-south1-docker.pkg.dev/radhaproject-500302/quickstore-images/frontend
  BACKEND_URL: https://quickstore-backend-771498653907.asia-south1.run.app

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/771498653907/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@radhaproject-500302.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # Build image directly on GitHub runner — bakes VITE_API_URL into the JS bundle
      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL="${{ env.BACKEND_URL }}/v1" \
            --build-arg VITE_RAZORPAY_KEY_ID="rzp_test_placeholder" \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            -t "${{ env.IMAGE }}:latest" \
            .

      - name: Push image to Artifact Registry
        run: |
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 3000 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --quiet

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)")
          echo "✅ Frontend live at: $URL"
