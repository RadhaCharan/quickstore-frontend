name: Deploy Frontend → GCP Cloud Run

on:
  push:
    branches: [main]          # Auto-triggers on every push to main

permissions:
  contents: read
  id-token: write             # Required for Workload Identity Federation

env:
  PROJECT_ID: radhaproject-500302
  REGION: asia-south1
  SERVICE: quickstore-frontend
  IMAGE: asia-south1-docker.pkg.dev/radhaproject-500302/quickstore-images/frontend
  BACKEND_URL: https://quickstore-backend-771498653907.asia-south1.run.app

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Authenticate to GCP via Workload Identity Federation (no JSON key)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/771498653907/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@radhaproject-500302.iam.gserviceaccount.com

      # 3. Set up gcloud CLI
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 4. Configure Docker to push to Artifact Registry
      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # 5. Build image via Cloud Build, passing backend URL as build arg
      #    Vite bakes VITE_API_URL into the JS bundle at build time
      - name: Build & push image
        run: |
          cat > /tmp/cloudbuild-frontend.yaml << 'EOF'
          steps:
          - name: 'gcr.io/cloud-builders/docker'
            args:
            - build
            - '--build-arg'
            - 'VITE_API_URL=$_BACKEND_URL/v1'
            - '--build-arg'
            - 'VITE_RAZORPAY_KEY_ID=rzp_test_placeholder'
            - '-t'
            - '$_IMAGE:$_SHA'
            - '-t'
            - '$_IMAGE:latest'
            - '.'
          images:
          - '$_IMAGE:$_SHA'
          - '$_IMAGE:latest'
          EOF

          gcloud builds submit \
            --config /tmp/cloudbuild-frontend.yaml \
            --substitutions "_BACKEND_URL=${{ env.BACKEND_URL }},_IMAGE=${{ env.IMAGE }},_SHA=${{ github.sha }}" \
            --project ${{ env.PROJECT_ID }} \
            --quiet

      # 6. Deploy new revision to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 3000 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --quiet

      # 7. Print the live URL
      - name: Print service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)")
          echo "✅ Frontend live at: $URL"
